[package]
name = "nuome"
version = "0.1.0"
edition = "2021"
description = "Deterministic natural-language math solver: lexicon + rewrite rules + beam search, every step explained and every answer checked"
license = "MIT"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "nuome"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
neuras = { path = "../Neuras", optional = true }

[features]
# the Neuras network in --ideas prime-function
neural = ["dep:neuras"]
