# ---- Judges: preferences about the path as a whole ------------------------------
# A judge adds  weight * (axes . profile) * amount  to a step.

[judges.fractions]        # a step that makes new fractions before it has to
weight = -0.5
axes = { elegance = 1.0, clarity = 0.5 }

[judges.negative_lead]    # leaving the letter with a minus sign in front
weight = -0.4
axes = { clarity = 1.0 }

[judges.method_switch]    # starting one method, then switching to another
weight = -2.0
axes = { clarity = 1.0, elegance = 1.0 }

[judges.growth]           # per node the expression grows by
weight = -0.03
axes = { clarity = 0.5, brevity = 0.5 }

[judges.brackets_first]   # moving terms across while a side still has brackets to multiply out
weight = -0.15
axes = { clarity = 1.0 }

[judges.arithmetic_first] # a real step while plain number work (7 - 3) is still waiting
weight = -0.15
axes = { clarity = 1.0 }

[judges.branch_order]     # working on a later alternative while an earlier one is unfinished
weight = -0.05
axes = { clarity = 1.0 }

