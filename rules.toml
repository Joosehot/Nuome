# ---- Proofs: logic and sets ----
# One Boolean algebra: each law works on statements (not, and, or) and on sets
# (complement, intersection, union). A law never proves itself: when the
# statement is a single instance of a law, the truth table proves it.

[rules.impl_elim]          # P -> Q is ~P or Q
weight = 1.0
[rules.impl_elim.variants.or]

[rules.iff_elim]          # P <-> Q: both ways, or by cases (longer)
weight = 1.0
[rules.iff_elim.variants.both_ways]
clarity = 0.1
[rules.iff_elim.variants.cases]
clarity = -0.2

[rules.de_morgan]          # ~(P and Q) is ~P or ~Q; ~(P or Q) is ~P and ~Q (and for sets)
weight = 1.0
[rules.de_morgan.variants.and]
clarity = 0.1
[rules.de_morgan.variants.or]
clarity = 0.1

[rules.double_negation]          # ~~P is P
weight = 1.0
minor = true
[rules.double_negation.variants.twice]

[rules.distributive]          # spreading grows the statement; taking a common part out shrinks it
weight = 1.0
[rules.distributive.variants.and_over_or]
elegance = -0.2
[rules.distributive.variants.or_over_and]
elegance = -0.2
[rules.distributive.variants.factor_and]
elegance = 0.2
[rules.distributive.variants.factor_or]
elegance = 0.2

[rules.absorption]          # P or (P and Q) is P
weight = 1.0
[rules.absorption.variants.or]
elegance = 0.2
[rules.absorption.variants.and]
elegance = 0.2

[rules.idempotence]          # P or P is P
weight = 1.0
[rules.idempotence.variants.and]
[rules.idempotence.variants.or]

[rules.excluded_middle]          # P or ~P is T; P and ~P is F
weight = 1.0
[rules.excluded_middle.variants.middle]
clarity = 0.1
[rules.excluded_middle.variants.contradiction]
clarity = 0.1

[rules.logic_identity]          # P and T is P; P or F is P
weight = 1.0
minor = true
[rules.logic_identity.variants.and_true]
[rules.logic_identity.variants.or_false]

[rules.domination]          # P or T is T; P and F is F
weight = 1.0
[rules.domination.variants.or_true]
[rules.domination.variants.and_false]

[rules.negate_constant]          # ~T is F; ~F is T
weight = 1.0
minor = true
[rules.negate_constant.variants.flip]

[rules.modus_ponens]          # (P -> Q) and P is Q and P; (P -> Q) and ~Q is ~P and ~Q
weight = 1.0
[rules.modus_ponens.variants.ponens]
clarity = 0.2
elegance = 0.3
[rules.modus_ponens.variants.tollens]
clarity = 0.2
elegance = 0.3

[rules.set_difference]          # X \ Y = X intersect Y'
weight = 1.0
[rules.set_difference.variants.complement]

[rules.assume]          # to prove P -> Q, assume P and show Q
weight = 1.0
[rules.assume.variants.hypothesis]
clarity = 0.2
elegance = 0.3
[rules.assume.variants.again]
clarity = 0.2
elegance = 0.3

[rules.element_chase]          # sets equal when any element is in one exactly when in the other: the textbook default
weight = 1.0
[rules.element_chase.variants.equal]
clarity = 0.3
[rules.element_chase.variants.subset]
clarity = 0.3

[rules.equiv_end]          # both sides the same up to order, or T
weight = 1.0
[rules.equiv_end.variants.same]
[rules.equiv_end.variants.true]

[rules.entails_end]          # the goal is among the assumptions, or the assumption among the alternatives
weight = 1.0
[rules.entails_end.variants.same]
[rules.entails_end.variants.conjunct]
[rules.entails_end.variants.disjunct]
[rules.entails_end.variants.part]
[rules.entails_end.variants.instance]
[rules.entails_end.variants.trivial]

[rules.truth_table]          # every row written out: a proof, but brute force; the laws are preferred unless asked for (or the statement IS a law)
weight = 1.0
[rules.truth_table.variants.truth]
brevity = 0.2
clarity = -1.0
elegance = -2.5
[rules.truth_table.variants.membership]
brevity = 0.2
clarity = -1.0
elegance = -2.5

[rules.quant_negation]          # ~(forall x P(x)) is exists x ~P(x); ~(exists x P(x)) is forall x ~P(x)
weight = 1.0
[rules.quant_negation.variants.forall]
clarity = 0.1
[rules.quant_negation.variants.exists]
clarity = 0.1

[rules.quant_distribution]      # forall over and, exists over or; or gathered back under one quantifier
