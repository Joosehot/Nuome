# Nuome math rules and tradeoffs. Every number the engine uses lives here;
# rule code only names keys.
#
# Every step is scored on three axes:
#   brevity  - fewer, bigger steps: get to the answer
#   clarity  - small, familiar steps a learner can follow
#   elegance - methods that show structure (factoring, identities, clearing
#              fractions early) over brute force
# A step scores  weight * (variant axes . profile), minus the cost of a step.
# The profile starts at [profile] and the sentence's modifiers shift it
# ("quickly", "step by step", "for a beginner", "elegantly"): the words say
# which tradeoff to spend. This is FeelRight's tension curve, Senne's
# safety/brevity profile and Aras's finish/economy.

[search]
beam = 16
fallback = 96              # wider beam, used only when nothing passes the checks
max_steps = 40
progress = 0.35            # weight of the distance-to-done estimate for unfinished paths

[profile]
brevity = 0.5
clarity = 1.0
elegance = 0.5

[modifiers.brief]          # "quickly", "just the answer"
brevity = 1.5
clarity = -0.6

[modifiers.detailed]       # "step by step", "show your work"
clarity = 1.0
brevity = -0.4

[modifiers.beginner]       # "for a beginner", "simply"
clarity = 1.5
brevity = -0.4
elegance = -0.3

[modifiers.elegant]        # "elegantly", "cleverly"
elegance = 1.5

[steps]
cost = 0.3
brevity_cost = 0.6
minor_share = 0.3

# ---- Which rules each task may use -------------------------------------------
# Factoring never sees distribute (it would undo it), expanding never sees
# the factoring rules.
[tasks]
evaluate = ["substitute", "fold", "roots", "cancel", "identity", "gcd", "lcm", "modulo", "factorial", "choose", "mean", "median", "mode", "range", "spread", "sum_to", "sequence", "compound", "percent", "neg_exponent", "frac_exponent", "rationalise", "log_eval", "log_laws", "trig_exact", "func_exact"]
simplify = ["substitute", "fold", "identity", "cancel", "roots", "powers", "collect", "distribute", "multiply_out", "rational_cancel", "add_fractions", "power_quotient", "neg_exponent", "frac_exponent", "rationalise", "compound_fraction", "log_eval", "log_laws", "trig_exact", "func_exact", "trig_identity"]
expand = ["fold", "identity", "cancel", "roots", "powers", "collect", "distribute", "multiply_out", "log_laws", "log_eval"]
factor = ["fold", "identity", "powers", "collect", "factor_common", "diff_squares", "trinomial", "prime_factors", "factor_theorem"]
solve = ["fold", "identity", "cancel", "roots", "powers", "collect", "distribute", "multiply_out", "factor_common", "clear_denominators", "move_term", "scale", "swap", "verdict", "factor_solve", "zero_product", "quadratic_formula", "square_root", "complete_square", "solutions", "factor_theorem", "log_eval", "log_laws", "log_to_exp", "power_base", "equate_exponents", "take_log", "log_domain", "ineq_add", "ineq_scale", "ineq_swap", "ineq_verdict", "sign_chart", "add_fractions", "abs_split", "abs_check", "eliminate", "substitution", "back_substitute", "system_scale", "system_verdict", "trig_exact", "trig_solve"]
differentiate = ["diff_linear", "diff_power", "diff_elementary", "diff_product", "diff_quotient", "diff_chain", "fold", "identity", "cancel", "powers", "collect", "substitute"]
prove = ["sides_equal", "induction", "divides_factor", "consecutive", "residues", "ineq_zero", "square_form", "nonneg", "clear_denominators", "fold", "identity", "cancel", "roots", "powers", "collect", "distribute", "multiply_out", "add_fractions", "rational_cancel", "trig_identity", "trig_exact", "func_exact", "log_laws", "log_eval", "impl_elim", "iff_elim", "de_morgan", "double_negation", "distributive", "absorption", "idempotence", "excluded_middle", "logic_identity", "domination", "negate_constant", "modus_ponens", "set_difference", "assume", "element_chase", "equiv_end", "entails_end", "truth_table", "quant_negation", "quant_distribution"]
# ---- Algebra: tasks ----
divide = ["poly_divide"]
# calculus and trig (agent B). int_constant goes last: C is written once the rest is done.
integrate = ["int_linear", "int_power", "int_elementary", "int_substitution", "int_parts", "int_partial_fractions", "int_bounds", "int_expand", "int_power_reduction", "fold", "identity", "cancel", "roots", "powers", "collect", "trig_exact", "func_exact", "int_constant"]
limit = ["lim_substitute", "lim_factor", "lim_standard", "lim_infinity", "lim_infinite", "lim_lhopital", "diff_linear", "diff_power", "diff_elementary", "diff_product", "diff_quotient", "diff_chain", "fold", "identity", "cancel", "roots", "powers", "collect", "trig_exact", "func_exact"]
tangent = ["diff_linear", "diff_power", "diff_elementary", "diff_product", "diff_quotient", "diff_chain", "evaluate_at", "fold", "identity", "cancel", "roots", "powers", "collect", "distribute", "trig_exact", "func_exact", "line_form"]
# ---- Proofs: abstract algebra ----
# A statement about a group or a ring ("in a group, prove ...") uses only
# these: no rule for numbers, which may commute a product, ever sees it.
prove_group = ["sides_equal", "use_hypothesis", "group_inverse", "group_identity", "group_assoc", "group_comm", "group_inverse_unique", "group_inverse_product", "group_inverse_inverse", "group_inverse_identity", "group_cancel_left", "group_cancel_right"]
prove_ring = ["sides_equal", "use_hypothesis", "ring_neg", "ring_zero", "ring_distrib", "ring_add_assoc", "ring_add_comm", "ring_mul_assoc", "ring_neg_unique", "ring_add_cancel", "ring_mul_zero", "ring_zero_mul", "ring_neg_neg", "ring_neg_mul", "ring_mul_neg"]

# Alternative methods for the same job. A path that starts one and switches
# pays the method_switch judge; "using the quadratic formula" forbids the others.
[methods]
quadratic = ["factor_solve", "quadratic_formula", "square_root", "complete_square"]
# ---- Algebra: methods ----
system = ["eliminate", "substitution"]

# ---- Proofs: logic and sets ----
# "by truth table" / "by element chasing": a proof of logic or sets by one method or the other
logic_proof = ["truth_table", "element_chase"]

[method_follow]
complete_square = ["square_root"]

